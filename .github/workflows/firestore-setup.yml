name: Firestore check
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g firebase-tools
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          echo "== databases =="
          firebase firestore:databases:list --project klavier-academy || true
          firebase firestore:databases:get "(default)" --project klavier-academy || true
          echo "== publish rules =="
          firebase deploy --only firestore:rules --project klavier-academy || echo "rules deploy did not complete"
          rm -f "$RUNNER_TEMP/sa.json"
